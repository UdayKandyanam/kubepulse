# Example KubePulse config. Pass it with the config flag:
#   kubepulse diagnose --config examples/thresholds.yaml examples/broken.json
# Every setting is optional. Anything left out keeps its default.

# Flag a container when its memory usage reaches this percent of its
# limit. Default is 90.
memory_threshold_percent: 80

# Severity overrides, one line per detector. Names not listed here
# keep the severity their detector assigns.
severities:
  no-resource-limits: medium

# Detectors can also be turned off, one line per detector. A detector
# set to false, or not listed here, stays on. For example, to stop
# reporting containers without resource limits at all, add:
# disabled_detectors:
#   no-resource-limits: true
